services:
  - type: web
    name: youtube-ai-karaoke-backend
    runtime: docker
    dockerfilePath: Dockerfile
    plan: starter
    region: singapore
    envVars:
      - key: PORT
        value: 8000
      - key: DEMUCS_MODEL
        value: htdemucs
      - key: YOUTUBE_API_KEY
        sync: false
